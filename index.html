<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>FlexiFit Gym Membership</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>FlexiFit Gym</h1>
      <h2>Choose Your Membership Plan</h2>

      <div class="plans">
        <div class="plan-card">
          <h3>Monthly Plan</h3>
          <p>€40 per month</p>

          <ul>
            <li>Full gym access</li>
            <li>Free fitness assessment</li>
            <li>Cancel anytime</li>
          </ul>

          <a href="register.html?plan=Monthly">
            <button>Apply for Monthly</button>
          </a>
        </div>

        <div class="plan-card">
          <h3>Annual Plan</h3>
          <p>€400 per year</p>

          <ul>
            <li>Full gym access</li>
            <li>Free fitness assessment</li>
            <li>2 months free</li>
          </ul>

          <a href="register.html?plan=Monthly">
            <button>Apply for Monthly</button>
          </a>
        </div>
      </div>

      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
